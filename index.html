<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07060d" />
    <title>Shadow Escape</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #07060d;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        outline: none;
      }
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        color: #cbb8ff;
        font: 600 18px 'Trebuchet MS', sans-serif;
        text-align: center;
        background: rgba(7, 6, 13, 0.92);
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Rotate your device to landscape<br />for the best experience</div>
    <script>
      // Keep the page completely still on mobile: no pull-to-refresh, pinch zoom,
      // double-tap zoom, long-press menus or scroll bounce while playing.
      (function () {
        var stop = function (e) {
          if (e.cancelable) e.preventDefault();
        };
        document.addEventListener('touchmove', stop, { passive: false });
        document.addEventListener('gesturestart', stop, { passive: false });
        document.addEventListener('dblclick', stop, { passive: false });
        document.addEventListener('contextmenu', stop);
        // Note: no keydown preventDefault here - Phaser ignores defaultPrevented key events.
        // The page cannot scroll anyway (fixed body, overflow hidden) and Phaser captures game keys.
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
